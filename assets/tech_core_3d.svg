<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Gradients -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#737373" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#737373" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#262626" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes scanMatrix {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes blinkText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .rotating-outer {
      transform-origin: 500px 160px;
      animation: spinClockwise 28s linear infinite;
    }
    .rotating-inner {
      transform-origin: 500px 160px;
      animation: spinCounter 18s linear infinite;
    }
    .floating-group {
      animation: floatCube 6s ease-in-out infinite;
      transform-origin: 500px 160px;
    }
    .core-pulse {
      transform-origin: 500px 160px;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .scanner-beam {
      animation: scanMatrix 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .hud-text {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #a3a3a3;
    }
    .hud-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 700;
      letter-spacing: 4px;
      font-size: 13px;
      fill: #ffffff;
    }
  </style>

  <!-- Background Grid Plate -->
  <rect x="50" y="20" width="900" height="280" rx="14" fill="#050505" stroke="#262626" stroke-width="1.2" />
  
  <!-- Subtle Background Grid Lines -->
  <line x1="50" y1="90" x2="950" y2="90" stroke="#171717" stroke-dasharray="4,6" />
  <line x1="50" y1="160" x2="950" y2="160" stroke="#171717" stroke-dasharray="4,6" />
  <line x1="50" y1="230" x2="950" y2="230" stroke="#171717" stroke-dasharray="4,6" />
  <line x1="280" y1="20" x2="280" y2="300" stroke="#171717" stroke-dasharray="4,6" />
  <line x1="500" y1="20" x2="500" y2="300" stroke="#171717" stroke-dasharray="4,6" />
  <line x1="720" y1="20" x2="720" y2="300" stroke="#171717" stroke-dasharray="4,6" />

  <!-- Left HUD Panel Telemetry -->
  <g transform="translate(80, 60)">
    <text x="0" y="10" class="hud-title">JRG // WEBGL MATRIX</text>
    <text x="0" y="32" class="hud-text">STATUS: ACTIVE_RENDERER</text>
    <text x="0" y="52" class="hud-text">ENGINE: THREE.JS R168</text>
    <text x="0" y="72" class="hud-text">PIPELINE: GSAP + SHADERS</text>
    <text x="0" y="92" class="hud-text">SCROLL: LENIS_PHYSICS</text>
    <text x="0" y="112" class="hud-text">FPS_TARGET: 120 FPS</text>
    
    <path d="M 0 135 L 140 135" stroke="#404040" stroke-width="1" />
    <circle cx="5" cy="150" r="3" fill="#22c55e" />
    <text x="16" y="153" class="hud-text" fill="#ffffff">SYSTEM_HEALTH 100%</text>
  </g>

  <!-- Right HUD Panel Telemetry -->
  <g transform="translate(740, 60)">
    <text x="0" y="10" class="hud-title">3D VIEWPORT // XYZ</text>
    <text x="0" y="32" class="hud-text">ROT_X: [ +34.28° ]</text>
    <text x="0" y="52" class="hud-text">ROT_Y: [ -45.12° ]</text>
    <text x="0" y="72" class="hud-text">FOV: 60° ISOMETRIC</text>
    <text x="0" y="92" class="hud-text">DRAW_CALLS: OPTIMIZED</text>
    <text x="0" y="112" class="hud-text">VERTICES: 128,400</text>
    
    <path d="M 0 135 L 140 135" stroke="#404040" stroke-width="1" />
    <text x="0" y="153" class="hud-text" style="animation: blinkText 2s infinite;">● REALTIME BUFFER</text>
  </g>

  <!-- Central Glowing Ambient -->
  <circle cx="500" cy="160" r="90" fill="url(#coreGlow)" class="core-pulse" />

  <!-- Outer Orbit Rings (Rotating) -->
  <g class="rotating-outer">
    <ellipse cx="500" cy="160" rx="115" ry="55" fill="none" stroke="#404040" stroke-width="1.2" stroke-dasharray="10,14" />
    <circle cx="385" cy="160" r="4" fill="#ffffff" filter="url(#neonBlur)" />
    <circle cx="615" cy="160" r="4" fill="#ffffff" filter="url(#neonBlur)" />
  </g>

  <!-- Inner Orbit Rings (Counter-Rotating) -->
  <g class="rotating-inner">
    <ellipse cx="500" cy="160" rx="90" ry="90" fill="none" stroke="#262626" stroke-width="1" />
    <ellipse cx="500" cy="160" rx="90" ry="38" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="6,8" />
    <circle cx="500" cy="70" r="3" fill="#a3a3a3" />
    <circle cx="500" cy="250" r="3" fill="#a3a3a3" />
  </g>

  <!-- 3D Floating Isometric Hypercube -->
  <g class="floating-group">
    <!-- Outer Wireframe Isometric Cube -->
    <!-- Top Face -->
    <polygon points="500,105 545,130 500,155 455,130" fill="#171717" fill-opacity="0.7" stroke="#ffffff" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="455,130 500,155 500,210 455,185" fill="#0a0a0a" fill-opacity="0.85" stroke="#737373" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="545,130 500,155 500,210 545,185" fill="#141414" fill-opacity="0.9" stroke="#e5e5e5" stroke-width="1.5" />

    <!-- Inner Core Floating Gem -->
    <polygon points="500,125 525,140 500,155 475,140" fill="#ffffff" fill-opacity="0.9" filter="url(#neonBlur)" />
    <polygon points="475,140 500,155 500,185 475,170" fill="#a3a3a3" />
    <polygon points="525,140 500,155 500,185 525,170" fill="#e5e5e5" />
    
    <!-- Wireframe Diagonal Projection Lines -->
    <line x1="500" y1="105" x2="500" y2="70" stroke="#737373" stroke-dasharray="2,3" />
    <line x1="455" y1="185" x2="420" y2="205" stroke="#737373" stroke-dasharray="2,3" />
    <line x1="545" y1="185" x2="580" y2="205" stroke="#737373" stroke-dasharray="2,3" />

    <!-- Geometric Nodes -->
    <circle cx="500" cy="105" r="3" fill="#ffffff" />
    <circle cx="545" cy="130" r="3" fill="#ffffff" />
    <circle cx="455" cy="130" r="3" fill="#ffffff" />
    <circle cx="500" cy="155" r="3.5" fill="#ffffff" filter="url(#neonBlur)" />
    <circle cx="500" cy="210" r="3" fill="#ffffff" />
    <circle cx="455" cy="185" r="3" fill="#ffffff" />
    <circle cx="545" cy="185" r="3" fill="#ffffff" />
  </g>

  <!-- Horizontal Scanning Laser Beam -->
  <g class="scanner-beam">
    <line x1="50" y1="20" x2="50" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.6" filter="url(#neonBlur)" />
  </g>

  <!-- Bottom Interactive Sub-Bar -->
  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="900" height="25" fill="#0a0a0a" rx="4" />
    <text x="20" y="16" class="hud-text" font-size="10px">◈ JRG AGENCY // INTERACTIVE THREE.JS ENGINE • ARCHITECTURE OVERVIEW</text>
    <text x="730" y="16" class="hud-text" font-size="10px" fill="#ffffff">CLICK TO EXPAND BELOW ▼</text>
  </g>
</svg>
