<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%" height="30" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0" />
      <stop offset="15%" stop-color="#404040" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="85%" stop-color="#404040" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes scan {
      0% { transform: translateX(-300px); }
      50% { transform: translateX(1200px); }
      100% { transform: translateX(-300px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    .base-line {
      animation: pulse 4s ease-in-out infinite;
    }
    .scanner {
      animation: scan 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Background base subtle line -->
  <line x1="50" y1="15" x2="1150" y2="15" stroke="url(#lineGrad)" stroke-width="1.5" class="base-line" />
  
  <!-- Central tech diamond accents -->
  <polygon points="600,8 607,15 600,22 593,15" fill="#ffffff" filter="url(#glow)" />
  <circle cx="570" cy="15" r="2.5" fill="#a3a3a3" />
  <circle cx="630" cy="15" r="2.5" fill="#a3a3a3" />
  <circle cx="540" cy="15" r="1.5" fill="#525252" />
  <circle cx="660" cy="15" r="1.5" fill="#525252" />

  <!-- Animated Scanner beam -->
  <g class="scanner">
    <line x1="0" y1="15" x2="250" y2="15" stroke="url(#scanGlow)" stroke-width="2.5" filter="url(#glow)" />
  </g>
</svg>
